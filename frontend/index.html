<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Mart Grocery - Online Grocery Shopping & Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <script src="js/main.js" defer></script>
    <script src="js/products.js" defer></script>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">🛒 Fresh Mart Grocery</a>
        </div>
        <nav>
            <ul id="nav-right">
                <!-- Injected dynamically by main.js -->
            </ul>
        </nav>
    </header>

    <div class="container">
        <!-- Hero Banner -->
        <div class="hero-banner">
            <h2>Fresh Groceries Delivered To Your Doorstep</h2>
            <p>Quality fruits, vegetables, dairy & daily essentials at the best prices</p>
            <br>
            <a href="products.html" class="btn btn-secondary hero-cta">Shop All Groceries</a>
        </div>

        <!-- Featured Products -->
        <h2 class="page-title">Featured Products</h2>
        <div class="product-grid" id="featured-products">
            <!-- Dynamically loaded by products.js -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Online Grocery Shopping & Management System | DBMS College Mini-Project</p>
    </footer>

</body>
</html>
