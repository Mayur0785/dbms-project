<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account - Online Grocery System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/main.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">🛒 Fresh Mart Grocery</a>
        </div>
        <nav>
            <ul id="nav-right"></ul>
        </nav>
    </header>

    <div class="container">
        <div class="form-card">
            <h2 class="auth-title">Create Customer Account</h2>
            
            <div id="alert-msg"></div>

            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required placeholder="e.g. Ramesh Sharma">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="ramesh@gmail.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Create password">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" required placeholder="9876543210">
                </div>
                <div class="form-group">
                    <label>Delivery Address</label>
                    <textarea id="address" rows="3" required placeholder="House No, Street, City, Pincode"></textarea>
                </div>
                <button type="submit" class="btn auth-btn">Register</button>
            </form>

            <p class="auth-redirect-text">
                Already have an account? <a href="login.html">Login Here</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Online Grocery Shopping & Management System | DBMS College Mini-Project</p>
    </footer>

</body>
</html>
