<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - Fresh Mart Grocery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <script src="js/main.js" defer></script>
    <script src="js/products.js" defer></script>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">🛒 Fresh Mart Grocery</a>
        </div>
        <nav>
            <ul id="nav-right"></ul>
        </nav>
    </header>

    <div class="container">
        <h2 class="page-title">Grocery Products</h2>

        <!-- Search & Filter Bar -->
        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="Search products (e.g. Apple, Milk, Rice)..." onkeyup="filterProducts()">
            <select id="category-select" onchange="filterProducts()">
                <option value="">All Categories</option>
            </select>
        </div>

        <!-- Products Grid -->
        <div class="product-grid" id="products-grid">
            <!-- Loaded dynamically by products.js -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Online Grocery Shopping & Management System | DBMS College Mini-Project</p>
    </footer>

</body>
</html>
